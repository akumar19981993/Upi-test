<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Prasad - UPI Test Payment</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #0288d1; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dr. Prasad - ट्रायल पेमेंट गेटवे</h2>
    <p>यह ₹1 का एक टेस्ट ट्रांजैक्शन है।</p>
    
    <div id="qrcode"></div>
    
    <p>या नीचे दिए गए बटन पर क्लिक करके सीधे मोबाइल ऐप खोलें:</p>
    <a id="upilink" class="btn" href="#">मोबाइल ऐप से पे करें</a>
</div>

<script>
    // ⚠️ ट्रायल के लिए यहाँ अपनी कोई भी असली UPI ID डाल सकते हैं
    var myUPI = "drprasad@okaxis"; 
    var myName = "Dr Prasad";
    var amount = "1.00"; 
    var note = "Trial Test Payment";

    var upiString = "upi://pay?pa=" + encodeURIComponent(myUPI) + 
                    "&pn=" + encodeURIComponent(myName) + 
                    "&tn=" + encodeURIComponent(note) + 
                    "&am=" + amount + 
                    "&cu=INR";

    document.getElementById("upilink").href = upiString;

    new QRCode(document.getElementById("qrcode"), {
        text: upiString,
        width: 200,
        height: 200
    });
</script>

</body>
</html>
